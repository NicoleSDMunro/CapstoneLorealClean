name: Validar painel Smart Launch
on:
  push:
    branches: [main, feature/smartlaunch-metodologia-final, feature/painel-4-areas]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py smartlaunch_app.py smartlaunch_core.py smartlaunch_ui.py smartlaunch_monthly.py
      - run: PYTHONPATH=. python tests/test_alert_rules.py
      - run: PYTHONPATH=. python tests/test_monthly.py
      - run: PYTHONPATH=. python tests/test_smoke.py
      - run: PYTHONPATH=. python tests/test_ui.py
