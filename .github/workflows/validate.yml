name: Validar painel Smart Launch
on:
  push:
    branches: [main, feature/smartlaunch-metodologia-final, feature/painel-4-areas]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py smartlaunch_app.py
      - run: python tests/test_smoke.py
